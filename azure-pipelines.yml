trigger:
- refs/tags/sdk/*
pr: none

steps:
- script: |
    export tag=$(git describe --tag)
    export tag=$(echo $tag | sed 's/sdk\///')
    echo "Using Tag: $tag"
    echo "##vso[task.setvariable variable=GITTAG;]$tag"
  displayName: Get tag

- task: UseDotNet@2
  displayName: Install .NET 8 SDK
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: 'restore'
    projects: |
      **/*.csproj
    feedsToUse: 'select'

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: 'build'
    projects: |
      **/*.csproj

- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: 'test'
    projects: |
      **/*.Test.csproj

- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: 'pack'
    packagesToPack: |
      **/Nethereum.Npgsql.csproj;
      **/Nethereum.Npgsql.EntityFrameworkCore.csproj
    includesymbols: true
    includesource: true
    versioningScheme: byEnvVar
    versionEnvVar: 'GITTAG'

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'Relayer SDK Nuget Connection'